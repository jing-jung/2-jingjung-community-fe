name: Frontend Deploy to ECR

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Images
        run: |
          # 프론트엔드 ECR 리포지토리 이름(community-fe) 확인
          docker build -t ${{ steps.login-ecr.outputs.registry }}/community-fe:latest .
          docker push ${{ steps.login-ecr.outputs.registry }}/community-fe:latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name community-eks-cluster --region ${{ secrets.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          kubectl apply -f frontend-deployment.yaml
          kubectl rollout restart deployment frontend-deployment