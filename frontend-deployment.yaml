apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend-container
          image: "016562553479.dkr.ecr.ap-southeast-2.amazonaws.com/community-fe:latest"          
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  annotations:
    # 이 주석이 있어야 AWS Load Balancer Controller가 작동합니다.
    service.beta.kubernetes.io/aws-load-balancer-type: nlb-ip
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer

  metadata:
  annotations:
    # 1. 외부 인터넷용 로드밸런서라고 명시
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    # 2. 로드밸런서가 위치할 'Public Subnet'들의 ID를 쉼표로 나열 (중요!)
    service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-0056e2194368afa19, subnet-07497df0436c8d138"