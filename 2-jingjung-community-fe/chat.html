<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채팅</title>
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/chat.css"> <!-- Ensure header styles are loaded -->
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="container">
        <div class="chat-header">
            <button id="back-btn" class="back-btn">&lt;</button>
            <h2 id="recipient-nickname">채팅</h2>
        </div>
        <div id="message-container" class="message-container">
            <!-- Messages will be loaded here -->
            <p class="system-message">대화를 시작해보세요.</p>
        </div>
        <form id="message-form" class="message-input-form">
            <textarea id="message-input" placeholder="메시지를 입력하세요..." rows="1"></textarea>
            <button id="send-btn" type="submit" disabled>전송</button>
        </form>
    </div>

    <script type="module" src="./js/config.js"></script>
    <script type="module" src="./js/header.js"></script> <!-- Load header logic -->
    <script type="module" src="./js/chat.js"></script>
</body>
</html>
