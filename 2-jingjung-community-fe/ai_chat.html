<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여울이의 안내소 - 맛집 추천</title>
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/chat.css"> 
    <style>
        /* 여울이 컨셉 살짝 추가 */
        .chat-header { background-color: #f8e182; padding: 15px; text-align: center; font-weight: bold; border-bottom: 3px solid #e1c15a; }
        .bot-message { background-color: #fff; border: 2px solid #f8e182; border-radius: 15px; padding: 10px; margin: 10px 0; align-self: flex-start; max-width: 80%; }
        .user-message { background-color: #dcf8c6; border-radius: 15px; padding: 10px; margin: 10px 0; align-self: flex-end; max-width: 80%; }
        .map-link { display: inline-block; margin-top: 5px; padding: 5px 10px; background-color: #4CAF50; color: white; border-radius: 10px; text-decoration: none; font-size: 0.8em; }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>
    <div class="chat-header">
        🐶 여울이의 마을 맛집 안내소
    </div>

    <main class="chat-main">
        <div id="chat-box" class="chat-content" style="display: flex; flex-direction: column; padding: 20px; height: 70vh; overflow-y: auto;">
            <div class="bot-message">
                안녕하세요! 우리 마을 안내원 여울이에용! 🏕️<br>
                어떤 맛집을 찾고 계신가요? (예: 강남구 파스타 맛집 추천해줘)
            </div>
        </div>

        <div class="chat-input-area" style="padding: 10px; display: flex; border-top: 1px solid #ddd;">
            <input type="text" id="chat-input" placeholder="여울이에게 물어보세요..." style="flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc;">
            <button id="send-btn" style="margin-left: 10px; padding: 10px 20px; border-radius: 20px; background-color: #f8e182; border: none; cursor: pointer;">전송</button>
        </div>
    </main>

    <script type="module" src="js/header.js"></script>
    <script type="module" src="js/ai_chat.js"></script>
</body>
</html>
