<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아무 말 대잔치 - 게시글 수정</title>
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/edit_post.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container">
        <h2 class="page-title">게시글 수정</h2>

        <form id="editForm" class="write-form">
            <div class="input-group">
                <label for="title">제목*</label>
                <input type="text" id="title" maxlength="26">
            </div>

            <div class="input-group">
                <label for="content">내용*</label>
                <textarea id="content"></textarea>
            </div>

            <div id="helperText" class="helper-text"></div>

            <div class="input-group">
                <label for="image">이미지</label>
                <div class="file-upload-wrapper">
                    <label for="imageInput" class="file-custom-btn">파일 선택</label>
                    <input type="file" id="imageInput" accept="image/*" class="file-input-hidden">
                    <span id="fileNameDisplay" class="file-name">선택된 파일 없음</span>
                </div>
            </div>

            <div class="button-area">
                <button type="button" id="submitBtn" class="submit-btn">수정하기</button>
            </div>
        </form>
    </main>

    <script src="./js/config.js"></script>
    <script type="module" src="./js/header.js"></script>
    <script type="module" src="js/edit_profile.js"></script>
</body>
</html>
