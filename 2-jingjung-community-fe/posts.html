<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아무 말 대잔치 - 게시글 목록</title>
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/posts.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <button id="turnipBtn" class="turnip-floating-btn">
        <img src="./images/radish_7.png" alt="무">
    </button>

    <div id="turnipModal" class="modal-overlay hidden">
        <div class="turnip-modal-box">
            <h3 class="turnip-title">무 주식 거래소</h3>
            <p class="turnip-price">현재 시세: <strong id="currentTurnipPrice">105</strong> 벨</p>
            <div class="turnip-input-group">
                <input type="number" id="turnipQuantity" min="1" placeholder="수량 입력">
                <span>개</span>
            </div>
            <div class="turnip-action-buttons">
                <button id="buyTurnipBtn" class="turnip-btn buy">구매</button>
                <button id="sellTurnipBtn" class="turnip-btn sell">판매</button>
            </div>
            <button id="closeTurnipModal" class="turnip-close-btn">닫기</button>
        </div>
    </div>

    <main class="container">
        <div id="datingBannerBtn" class="dating-banner">
    <div class="banner-content">
        <span class="banner-emoji">💌</span>
        <div class="banner-text">
            <strong>운명의 이웃 찾기</strong>
            <span>나와 딱 맞는 취향의 주민을 매칭해봐요!</span>
        </div>
    </div>
</div>

        <div class="intro-section" id="intro-section-link" style="cursor: pointer;">
            <p>안녕하세요,<br>아무 말 대잔치 <strong>게시판</strong> 입니다.</p>
            
            <button id="writeBtn" class="write-btn">게시글 작성</button>
        </div>

        <div id="postList" class="post-list">
            </div>

        <div id="loadingSentinel" class="loading-sentinel">Loading...</div>
            <button id="mapBtn" class="map-floating-btn" title="마을 지도 보기">🗺️</button>

        <div id="mapModal" class="modal-overlay hidden">
        <div class="map-modal-box">
            <h3 class="map-title">마을 전체 지도</h3>
            <p class="map-desc">현재 접속 중인 이웃 주민들의 위치에구리!</p>        
            <div class="map-container" id="mapContainer">
        </div>
        
            <button id="closeMapModal" class="turnip-close-btn">닫기</button>
        </div>
    </div>
        <button id="trainBtn" class="train-floating-btn" title="기차표 예매">
        <img src="./images/move_24.png" alt="기차"> </button>

    <div id="trainModal" class="modal-overlay hidden">
        <div class="train-modal-box">
            <div class="leaf-icon"><img src="./images/leaf_1.png" alt="나뭇잎"></div> <h3 class="train-title">너굴 레일 시간표</h3>
            <p class="train-desc">원하시는 출발 시간의 표를 예매해주세요구리!</p>
            
            <div class="timetable-list" id="timetableList">
                </div>
            
            <button id="closeTrainModal" class="turnip-close-btn">닫기</button>
        </div>
    </div>

    <div id="queueModal" class="modal-overlay hidden">
        <div class="queue-box">
            <div class="spinner"></div>
            <h3>접속 대기 중...</h3>
            <p style="font-size: 14px; color: #666; margin-top: 10px;">
                예매 대기 인원이 많아 접속 대기 중입니다.<br>잠시만 기다려주세요.
            </p>
            <p class="queue-count">내 앞에 대기자: <span id="queueNumber">142</span>명</p>
        </div>
    </div>
    </main>

    <script type="module" src="./js/config.js"></script>
    <script type="module" src="./js/header.js"></script>
    <script type="module" src="./js/posts.js"></script>
</body>
</html>
