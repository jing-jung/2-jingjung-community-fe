server {
    listen 80;

    # 프론트엔드 연결
    location / {
        proxy_pass http://frontend:3000; # 프론트엔드 서비스 이름과 포트
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 백엔드 연결 (/api 로 시작하는 요청 기준)
    location /api {
        proxy_pass http://backend:8080; # 백엔드 서비스 이름과 포트
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}